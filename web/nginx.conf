# farc/hls_server are docker-compose service names on the compose network
# this image is meant to run on (see docker-compose.yaml) -- not a generic
# reverse-proxy config for other topologies.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/farcd/ {
        proxy_pass http://farc:8080/;
    }

    location /api/hls/ {
        proxy_pass http://hls_server:8090/;
    }

    # hls_server's playlists (internal/playlist/playlist.go) reference their
    # init/media segments with root-absolute URIs ("/segments/{channel}/
    # {storage}/{uuid}/...") -- correct against hls_server's own origin, but
    # the browser resolves them against *this* origin, not the /api/hls/
    # prefix the playlist itself was fetched through. Without this location,
    # every segment request falls through to the SPA fallback below and gets
    # served index.html (200, text/html) instead of fMP4 bytes -- hls.js then
    # fails to find a moof box and throws fragParsingError. Found via the
    # e2e/ harness (PLAN.md Phase 17): a real two-channel playback attempt
    # never got past this before even reaching the segment cache/TOC fixes.
    location /segments/ {
        proxy_pass http://hls_server:8090;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
