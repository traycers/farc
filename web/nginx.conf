# farc/hlsd are docker-compose service names on the compose network
# this image is meant to run on (see docker-compose.yaml) -- not a generic
# reverse-proxy config for other topologies.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # proxy_http_version/Upgrade/Connection are needed alongside the plain
    # HTTP routes this location also serves, since fblock-live's WS endpoint
    # (internal/api/fblocktree.go's handleLiveTreeWS) lives on farcd's main
    # API port (8080), unlike EventPushServer's separate /api/events/ below.
    location /api/farcd/ {
        proxy_pass http://farc:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/hls/ {
        proxy_pass http://hlsd:8090/;
    }

    # apid (.scratch/live-page/spec.md) -- plain REST, no WS/Upgrade needed.
    location /api/apid/ {
        proxy_pass http://apid:8100/;
    }

    # WHEP signaling for the Live page, proxied same-origin instead of the
    # browser hitting mediamtx's WebRTC port directly (.scratch/
    # live-page-fixes/issues/03-whep-proxy-through-nginx.md -- a local
    # proxy/antivirus/browser extension intercepting the direct
    # cross-origin request was the real cause of a reported CORS/403
    # failure, not mediamtx itself). proxy_redirect rewrites mediamtx's
    # WHEP Location response header (a path-absolute "/{path}/whep/
    # {secret}", confirmed against mediamtx's own sessionLocation source)
    # back under this prefix -- without it, the teardown DELETE the
    # browser sends on disconnect would silently escape /api/whep/ and
    # leak the WHEP session on mediamtx with no visible symptom. Media
    # itself (RTP/ICE over UDP) is unaffected, only this HTTP signaling.
    location /api/whep/ {
        proxy_pass http://mediamtx:8889/;
        proxy_redirect / /api/whep/;
    }

    # farcd's EventPushServer (internal/api/eventpush.go) -- its own listener
    # on farc:8081, not the main HTTP API port, so this needs its own
    # location. Plain proxy_pass alone only forwards HTTP/1.0, which can't
    # carry a WebSocket Upgrade -- proxy_http_version 1.1 plus explicit
    # Upgrade/Connection passthrough is what actually lets the handshake
    # through (nginx doesn't forward hop-by-hop headers by default).
    location /api/events/ {
        proxy_pass http://farc:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # hlsd's playlists (internal/playlist/playlist.go) reference their
    # init/media segments with root-absolute URIs ("/segments/{channel}/
    # {storage}/{uuid}/...") -- correct against hlsd's own origin, but
    # the browser resolves them against *this* origin, not the /api/hls/
    # prefix the playlist itself was fetched through. Without this location,
    # every segment request falls through to the SPA fallback below and gets
    # served index.html (200, text/html) instead of fMP4 bytes -- hls.js then
    # fails to find a moof box and throws fragParsingError. Found via the
    # e2e/ harness (PLAN.md Phase 17): a real two-channel playback attempt
    # never got past this before even reaching the segment cache/TOC fixes.
    location /segments/ {
        proxy_pass http://hlsd:8090;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
