name: Release

# Every commit that lands on main gets a release, versioned CalVer-style as
# YYYY.MM.N -- N is that commit's 1-based count within the current month
# (the month's 1st commit is .1, 2nd is .2, ...), not a SemVer-style
# major/minor/patch distinction, so nothing here needs to judge what "kind"
# of change a commit is.
#
# Merging a PR via the GitHub UI *also* pushes the merge/squash/rebase
# result to main -- so a naive `push` + `pull_request: closed` pair would
# fire twice for the same commit. The `determine` job below tells them
# apart via the API (whether the pushed commit is already associated with
# a merged PR) rather than guessing from the commit message, since that
# works for all three merge strategies, including rebase (which otherwise
# leaves no trace at all).
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  # Needed to push the new version tag and to create the GitHub Release
  # with the default GITHUB_TOKEN -- that token is read-only otherwise.
  contents: write

# Serialize releases rather than cancel-in-progress: two pushes/merges close
# together must each get their own tag/release, not have one clobber the
# other's in-flight version count.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  determine:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Decide whether this event should release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This push might just BE a just-merged PR landing on main -- in
          # that case the pull_request-triggered run handles the release,
          # and this push must not also release the same commit.
          prs="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          if [ "$prs" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: determine
    if: needs.determine.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # CalVer: YYYY.MM.N, where N = git rev-list --count from the 1st of
      # the current month up to and including this commit -- no version
      # file, no dependency on the previous tag's value. Git tags keep the
      # "v" (v2026.08.5); Docker tags conventionally don't (2026.08.5).
      - name: Determine version
        id: version
        run: |
          year="$(date -u +%Y)"
          month="$(date -u +%m)"
          n="$(git rev-list --count --since="${year}-${month}-01T00:00:00Z" HEAD)"
          value="$year.$month.$n"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "tag=v$value" >> "$GITHUB_OUTPUT"

      - name: Tag release
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      # Self-contained guard rather than trusting the PR's own CI run --
      # cheap enough to just re-run before packaging a release.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - name: Build service images
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker build -f Dockerfile.farc -t farc:"$VERSION" .
          docker build -f Dockerfile.hls_server -t hls_server:"$VERSION" .
          docker build -t web:"$VERSION" ./web

      - name: Package release bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker save -o images.tar farc:"$VERSION" hls_server:"$VERSION" web:"$VERSION"
          sed "s/__VERSION__/$VERSION/g" deploy/docker-compose.release.yaml > docker-compose.yaml
          tar -cf farc-"$VERSION".tar images.tar docker-compose.yaml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$VERSION_TAG" farc-"$VERSION".tar --generate-notes
