name: Release

# Every PR merged into main gets a release: bump the patch version, tag it,
# build+package the three service images, publish a GitHub Release with the
# resulting *.tar. Plain pushes to main that aren't a PR merge (direct
# pushes, if branch protection ever allows them) intentionally don't trigger
# this -- only closed-and-merged PRs do.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  # Needed to push the new version tag and to create the GitHub Release
  # with the default GITHUB_TOKEN -- that token is read-only otherwise.
  contents: write

# Serialize releases rather than cancel-in-progress: two PRs merged close
# together must each get their own tag/release, not have one clobber the
# other's in-flight version bump.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # No version file in the repo -- the latest v*.*.* tag IS the current
      # version. Start at v0.1.0 if no tag exists yet.
      - name: Determine next version
        id: version
        run: |
          last="$(git tag --list 'v*.*.*' | sort -V | tail -1)"
          last="${last#v}"
          last="${last:-0.0.0}"
          IFS=. read -r major minor patch <<< "$last"
          value="$major.$minor.$((patch + 1))"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "tag=v$value" >> "$GITHUB_OUTPUT"

      - name: Tag release
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      # Self-contained guard rather than trusting the PR's own CI run --
      # cheap enough to just re-run before packaging a release.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - name: Build service images
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker build -f Dockerfile.farc -t farc:"$VERSION" .
          docker build -f Dockerfile.hls_server -t hls_server:"$VERSION" .
          docker build -t web:"$VERSION" ./web

      - name: Package release bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker save -o images.tar farc:"$VERSION" hls_server:"$VERSION" web:"$VERSION"
          sed "s/__VERSION__/$VERSION/g" deploy/docker-compose.release.yaml > docker-compose.yaml
          tar -cf farc-"$VERSION".tar images.tar docker-compose.yaml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$VERSION_TAG" farc-"$VERSION".tar --generate-notes
