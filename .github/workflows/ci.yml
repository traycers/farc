name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a still-running run for the same PR/branch once a newer push
# supersedes it -- no point finishing a lint/test run against code that's
# already been replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      # .golangci.yaml is a "version: 2" config -- v6 of this action only
      # supports golangci-lint v1, so a v2.x binary needs v7+ of the action.
      # v9 also drops the Node 20 runtime (deprecated by GitHub Actions)
      # in favor of Node 24.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  # go test -tags e2e ./tests/... runs `farc`/`hlsd` as two real OS
  # processes but seeds fcontainer data directly (see that file's own doc
  # comment), so -- unlike e2e/'s Playwright+Docker-compose suite, which
  # needs a user-supplied e2e/media/sample.mp4 that .gitignore deliberately
  # never commits -- it needs no external media and is safe to run here.
  e2e-real-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - run: go build -o farc ./cmd/farc
      - run: go build -o hlsd ./cmd/hlsd
      - run: go test -tags e2e ./tests/... -v

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Sanity-checks the four Dockerfiles still build -- no push, no tags
  # beyond Docker's own default, purely to catch a broken Dockerfile before
  # a release tag does (release.yml rebuilds these for real, with a version
  # tag, once a tag is pushed).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f Dockerfile.farc .
      - run: docker build -f Dockerfile.hlsd .
      - run: docker build -f Dockerfile.apid .
      - run: docker build ./web
