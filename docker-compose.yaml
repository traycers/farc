services:
  farc:
    build:
      context: .
      dockerfile: Dockerfile.farc
    environment:
      # HTTP/WS/Metrics server addresses -- deliberately not in
      # farc.config.json (internal/config's package doc): env vars are safe
      # to commit alongside compose, unlike the JSON file's storages/
      # channels lists, which stay file-based because farcd rewrites them
      # at runtime via POST/PUT/DELETE /storages and /channels.
      FARC_HTTP_IP: "0.0.0.0"
      FARC_HTTP_PORT: "8080"
      FARC_WS_IP: "0.0.0.0"
      FARC_WS_PORT: "8081"
      FARC_WS_MAX_CONNECTIONS: "100"
      FARC_METRICS_IP: "0.0.0.0"
      FARC_METRICS_PORT: "9090"
    volumes:
      # farc_config holds farc.config.json itself -- no repo file bind-mount
      # (nothing site-specific belongs in git). The volume starts out empty;
      # config.EnsureExists seeds it with an empty-but-valid config on first
      # start, and farcd persists storages/channels created via POST
      # /storages, /channels (e.g. through the web client) back into it, so
      # a container restart doesn't lose them
      # (internal/farcd.persistNewStorage/persistNewChannel).
      - farc_config:/etc/farc
      - farc_data:/data
    restart: unless-stopped

  hls_server:
    build:
      context: .
      dockerfile: Dockerfile.hls_server
    environment:
      # HTTP address, the one farcd it talks to (ADR-020), and segment/cache
      # tuning -- deliberately not in hls_server.config.json
      # (internal/hlsconfig's package doc): env vars are safe to commit
      # alongside compose, unlike the JSON file's channels list, which stays
      # the site-specific topology data.
      HLS_SERVER_HTTP_IP: "0.0.0.0"
      HLS_SERVER_HTTP_PORT: "8090"
      HLS_SERVER_FARC_HTTP: "http://farc:8080"
      HLS_SERVER_FARC_WS: "ws://farc:8081"
      HLS_SERVER_TARGET_SEGMENT_DURATION: "2s"
      # CACHE_BACKEND defaults to "disk" (internal/hlsconfig.loadEnv) --
      # single-instance deployments can leave this as-is. Running more than
      # one hls_server replica behind a load balancer needs a shared cache
      # instead: switch this to "s3" and point HLS_SERVER_S3_* below at the
      # seaweedfs service (already wired up here so that's a same-file
      # change, not a new one) -- see internal/segmentcache's package doc.
      HLS_SERVER_CACHE_BACKEND: "disk"
      HLS_SERVER_CACHE_DIR: "/var/cache/hls_server"
      HLS_SERVER_CACHE_QUOTA_BYTES: "10737418240"
      HLS_SERVER_S3_ENDPOINT: "seaweedfs:8333"
      HLS_SERVER_S3_BUCKET: "hls-segments"
      HLS_SERVER_S3_ACCESS_KEY: "hls_server"
      HLS_SERVER_S3_SECRET_KEY: "changeme"
      HLS_SERVER_S3_USE_SSL: "false"
    volumes:
      # hls_config holds hls_server.config.json itself -- no repo file
      # bind-mount (nothing site-specific belongs in git). The volume starts
      # out empty; hlsconfig.EnsureExists seeds it with an empty-but-valid
      # config on first start. Unlike farc_config, hls_server never rewrites
      # this file at runtime -- it's still the operator's job to add
      # channels to it (no CRUD API here, ADR-020's open question in
      # 12-hls-server.md §8 about a farcd/hls_server sync mechanism still
      # isn't resolved).
      - hls_config:/etc/hls_server
      - hls_cache:/var/cache/hls_server
    depends_on:
      - farc
    restart: unless-stopped

  # S3-compatible object store for hls_server's segment cache
  # (internal/segmentcache) when HLS_SERVER_CACHE_BACKEND=s3 -- lets more
  # than one hls_server replica share the same already-built segments
  # instead of each keeping its own local-disk cache. "weed server -s3" runs
  # master+volume+filer+the S3 gateway in one process, which is enough for a
  # single-node deployment; a real multi-node SeaweedFS cluster would split
  # these apart, but that's an ops decision, not a code one (hls_server only
  # ever talks to the S3 gateway).
  #
  # profiles: only starts with `docker compose --profile s3 up` -- a plain
  # `docker compose up` stays exactly as before (disk backend, no extra
  # container) for anyone who hasn't opted into the s3 backend above.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data
    profiles:
      - s3
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "80:80"
    depends_on:
      - farc
      - hls_server
    restart: unless-stopped

volumes:
  farc_config:
  farc_data:
  hls_config:
  hls_cache:
  seaweedfs_data:
