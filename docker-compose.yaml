services:
  # Local dev RTSP test source: mediamtx + a looping ffmpeg push of
  # e2e/media/sample.mp4, so the "Generate" button on the channel-add page
  # (web/src/pages/channels/ChannelNewPage.tsx) has a real, always-available
  # stream to point at. Same split as e2e/docker-compose.e2e.yaml's
  # mediamtx/ffmpeg-ch1 pair, just with a single "test" path.
  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx.dev.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      # WebRTC/WHEP -- the web app's Live page connects here directly from
      # the browser (.scratch/live-page/spec.md), so unlike the control
      # API below, this one is published to the host.
      - "8889:8889"
    expose:
      # Control API (mediamtx.dev.yml's api/apiAddress) -- apid's target.
      # Deliberately NOT published to the host, only reachable from other
      # containers on this compose network (apid).
      - "9997"
    restart: unless-stopped

  ffmpeg-test:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    entrypoint: []
    command: >
      ffmpeg -re -stream_loop -1 -i /media/sample.mp4
      -c copy -f rtsp rtsp://mediamtx:8554/test
    volumes:
      - ./e2e/media:/media:ro
    depends_on:
      - mediamtx
    restart: unless-stopped

  farc:
    build:
      context: .
      dockerfile: Dockerfile.farc
    environment:
      # HTTP/WS/Metrics server addresses -- deliberately not in
      # farc.config.json (internal/config's package doc): env vars are safe
      # to commit alongside compose, unlike the JSON file's storages/
      # channels lists, which stay file-based because farcd rewrites them
      # at runtime via POST/PUT/DELETE /storages and /channels.
      FARC_HTTP_IP: "0.0.0.0"
      FARC_HTTP_PORT: "8080"
      FARC_WS_IP: "0.0.0.0"
      FARC_WS_PORT: "8081"
      FARC_WS_MAX_CONNECTIONS: "100"
      FARC_METRICS_IP: "0.0.0.0"
      FARC_METRICS_PORT: "9090"
    volumes:
      # farc_config holds farc.config.json itself -- no repo file bind-mount
      # (nothing site-specific belongs in git). The volume starts out empty;
      # config.EnsureExists seeds it with an empty-but-valid config on first
      # start, and farcd persists storages/channels created via POST
      # /storages, /channels (e.g. through the web client) back into it, so
      # a container restart doesn't lose them
      # (internal/farcd.persistNewStorage/persistNewChannel).
      - farc_config:/etc/farc
      - farc_data:/data
    restart: unless-stopped

  hlsd:
    build:
      context: .
      dockerfile: Dockerfile.hlsd
    environment:
      # HTTP address, the one farcd it talks to (ADR-020), and segment/cache
      # tuning -- deliberately not in hlsd.config.json
      # (internal/hlsconfig's package doc): env vars are safe to commit
      # alongside compose, unlike the JSON file's channels list, which stays
      # the site-specific topology data.
      HLSD_HTTP_IP: "0.0.0.0"
      HLSD_HTTP_PORT: "8090"
      HLSD_METRICS_IP: "0.0.0.0"
      HLSD_METRICS_PORT: "9091"
      HLSD_FARC_HTTP: "http://farc:8080"
      HLSD_FARC_WS: "ws://farc:8081"
      HLSD_TARGET_SEGMENT_DURATION: "2s"
      # CACHE_BACKEND defaults to "disk" (internal/hlsconfig.loadEnv) --
      # single-instance deployments can leave this as-is. Running more than
      # one hlsd replica behind a load balancer needs a shared cache
      # instead: switch this to "s3" and point HLSD_S3_* below at the
      # seaweedfs service (already wired up here so that's a same-file
      # change, not a new one) -- see internal/segmentcache's package doc.
      HLSD_CACHE_BACKEND: "disk"
      HLSD_CACHE_DIR: "/var/cache/hlsd"
      HLSD_CACHE_QUOTA_BYTES: "10737418240"
      # HLSD_S3_ENDPOINT: "seaweedfs:8333"
      # HLSD_S3_BUCKET: "hls-segments"
      # HLSD_S3_ACCESS_KEY: "hlsd"
      # HLSD_S3_SECRET_KEY: "changeme"
      # HLSD_S3_USE_SSL: "false"
    volumes:
      # hlsd_config holds hlsd.config.json itself -- no repo file
      # bind-mount (nothing site-specific belongs in git). The volume starts
      # out empty; hlsconfig.EnsureExists seeds it with an empty-but-valid
      # config on first start. Unlike farc_config, hlsd never rewrites
      # this file at runtime -- it's still the operator's job to add
      # channels to it (no CRUD API here, ADR-020's open question in
      # 12-hls-server.md §8 about a farcd/hlsd sync mechanism still
      # isn't resolved).
      - hlsd_config:/etc/hlsd
      - hlsd_cache:/var/cache/hlsd
    depends_on:
      - farc
    restart: unless-stopped

  apid:
    build:
      context: .
      dockerfile: Dockerfile.apid
    environment:
      # apid's own listen address, the farcd it talks to, the mediamtx it
      # orchestrates, and the base URL browsers use for WHEP playback
      # (.scratch/live-page/spec.md) -- deliberately not in
      # apid.config.json (internal/apidconfig's package doc), same
      # env-vs-JSON split as farc/hlsd.
      APID_HTTP_IP: "0.0.0.0"
      APID_HTTP_PORT: "8100"
      APID_METRICS_IP: "0.0.0.0"
      APID_METRICS_PORT: "9101"
      APID_FARC_HTTP: "http://farc:8080"
      APID_MEDIAMTX_API_BASE: "http://mediamtx:9997"
      APID_MEDIAMTX_RTSP_BASE: "rtsp://mediamtx:8554"
      # This is what a browser on the host actually uses -- adjust for any
      # deployment where mediamtx's WebRTC port isn't reachable at
      # localhost (a real domain/IP, a reverse-proxied path, ...).
      APID_WEBRTC_PUBLIC_BASE: "http://localhost:8889"
    volumes:
      - apid_config:/etc/apid
    depends_on:
      - farc
      - mediamtx
    restart: unless-stopped

  # S3-compatible object store for hlsd's segment cache
  # (internal/segmentcache) when HLSD_CACHE_BACKEND=s3 -- lets more
  # than one hlsd replica share the same already-built segments
  # instead of each keeping its own local-disk cache. "weed server -s3" runs
  # master+volume+filer+the S3 gateway in one process, which is enough for a
  # single-node deployment; a real multi-node SeaweedFS cluster would split
  # these apart, but that's an ops decision, not a code one (hlsd only
  # ever talks to the S3 gateway).
  #
  # profiles: only starts with `docker compose --profile s3 up` -- a plain
  # `docker compose up` stays exactly as before (disk backend, no extra
  # container) for anyone who hasn't opted into the s3 backend above.
  # seaweedfs:
  #   image: chrislusf/seaweedfs:latest
  #   command: server -s3 -s3.port=8333 -dir=/data
  #   profiles:
  #     - s3
  #   volumes:
  #     - seaweedfs_data:/data
  #   restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "18881:80"
    depends_on:
      - farc
      - hlsd
      - apid
    restart: unless-stopped

  # Observability stack (.scratch/observability/spec.md) -- always on, not
  # an opt-in profile like s3 above: scrapes farc/hlsd's /metrics,
  # ships every container's stdout/stderr into Loki, and serves three
  # pre-built Grafana dashboards.
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.9
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  # Reads container logs via the Docker Engine API (docker.sock) and ships
  # them to loki -- no code change and no host-level log-driver plugin
  # needed in farc/hlsd/web.
  promtail:
    image: grafana/promtail:2.9.9
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./deploy/observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  farc_config:
  farc_data:
  hlsd_config:
  hlsd_cache:
  apid_config:
  prometheus_data:
  loki_data:
  grafana_data:
  # seaweedfs_data:
