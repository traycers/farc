# Scrape config for the farc/hlsd/apid /metrics endpoints
# (.scratch/observability/spec.md, .scratch/live-page/ for apid).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: farc
    static_configs:
      - targets: ["farc:30090"]

  - job_name: hlsd
    static_configs:
      - targets: ["hlsd:30092"]

  - job_name: apid
    static_configs:
      - targets: ["apid:30101"]
