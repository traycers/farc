# Scrape config for the farc/hlsd/apid /metrics endpoints
# (.scratch/observability/spec.md, .scratch/live-page/ for apid).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: farc
    static_configs:
      - targets: ["farc:9090"]

  - job_name: hlsd
    static_configs:
      - targets: ["hlsd:9091"]

  - job_name: apid
    static_configs:
      - targets: ["apid:9101"]
