# e2e stack (PLAN.md Phase 17): a real RTSP source (mediamtx + ffmpeg loop of
# a user-supplied e2e/media/sample.mp4) feeding two channels concurrently
# into farcd/hls_server, so a real Playwright/Chromium session can drive
# hls.js against genuine, decodable media instead of the synthetic byte
# fixtures every other test in this repo uses. Reuses the root Dockerfiles
# unchanged -- only the compose wiring and RTSP source are new.
#
# Run via `task test/e2e` (taskfile.yaml) or directly:
#   docker compose -f e2e/docker-compose.e2e.yaml up -d --build
#   cd e2e && npx playwright test
#   docker compose -f e2e/docker-compose.e2e.yaml down -v

services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
    restart: unless-stopped

  # Publishes e2e/media/sample.mp4 into mediamtx on loop, as two independent
  # RTSP paths -- separate containers (not mediamtx's own runOnInit hooks)
  # since the official mediamtx image isn't guaranteed to bundle ffmpeg.
  ffmpeg-ch1:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    entrypoint: []
    command: >
      ffmpeg -re -stream_loop -1 -i /media/sample.mp4
      -c copy -f rtsp rtsp://mediamtx:8554/ch1
    volumes:
      - ./media:/media:ro
    depends_on:
      - mediamtx
    restart: unless-stopped

  ffmpeg-ch2:
    image: jrottenberg/ffmpeg:6.1-ubuntu
    entrypoint: []
    command: >
      ffmpeg -re -stream_loop -1 -i /media/sample.mp4
      -c copy -f rtsp rtsp://mediamtx:8554/ch2
    volumes:
      - ./media:/media:ro
    depends_on:
      - mediamtx
    restart: unless-stopped

  farc:
    build:
      context: ..
      dockerfile: Dockerfile.farc
    environment:
      FARC_HTTP_IP: "0.0.0.0"
      FARC_HTTP_PORT: "8080"
      FARC_WS_IP: "0.0.0.0"
      FARC_WS_PORT: "8081"
      FARC_WS_MAX_CONNECTIONS: "100"
      FARC_METRICS_IP: "0.0.0.0"
      FARC_METRICS_PORT: "9090"
    ports:
      # exposed so tests/setup.ts (running on the host, outside this
      # compose network) can call farcd's HTTP API directly to create the
      # test storage/channels and poll candidates.
      - "18081:8080"
    volumes:
      - farc_config:/etc/farc
      - farc_data:/data
    depends_on:
      - mediamtx
    restart: unless-stopped

  hls_server:
    build:
      context: ..
      dockerfile: Dockerfile.hls_server
    environment:
      HLS_SERVER_HTTP_IP: "0.0.0.0"
      HLS_SERVER_HTTP_PORT: "8090"
      HLS_SERVER_METRICS_IP: "0.0.0.0"
      HLS_SERVER_METRICS_PORT: "9091"
      HLS_SERVER_FARC_HTTP: "http://farc:8080"
      HLS_SERVER_FARC_WS: "ws://farc:8081"
      HLS_SERVER_TARGET_SEGMENT_DURATION: "2s"
      # Required regardless of cache_backend (internal/hlsconfig also roots
      # staging dirs under it) -- s3 mode below doesn't exempt it.
      HLS_SERVER_CACHE_DIR: "/var/cache/hls_server"
      # s3 (not the disk default) so this stack actually exercises
      # internal/segmentcache's S3 backend end to end -- the existing
      # two-channel-playback.spec.ts already drives real cache-miss-then-hit
      # playback, so it covers the new backend with no test changes needed.
      HLS_SERVER_CACHE_BACKEND: "s3"
      HLS_SERVER_S3_ENDPOINT: "seaweedfs:8333"
      HLS_SERVER_S3_BUCKET: "hls-segments"
      HLS_SERVER_S3_ACCESS_KEY: "hls_server"
      HLS_SERVER_S3_SECRET_KEY: "changeme"
      HLS_SERVER_S3_USE_SSL: "false"
    volumes:
      - hls_config:/etc/hls_server
    depends_on:
      - farc
      - seaweedfs
    restart: unless-stopped

  # All-in-one SeaweedFS (master+volume+filer+S3 gateway) backing
  # hls_server's segment cache in s3 mode above -- see docker-compose.yaml's
  # own seaweedfs service comment for why this one process is enough here.
  # SeaweedFS doesn't auto-create buckets, so bucket-create runs once before
  # hls_server starts serving (hls_server itself never creates its bucket).
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.port=8333 -dir=/data
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    entrypoint: []
    command: >
      sh -c "sleep 3 && echo 's3.bucket.create -name hls-segments' | weed shell -master=seaweedfs:9333"
    depends_on:
      - seaweedfs
    restart: "no"

  web:
    build:
      context: ../web
    ports:
      - "18080:80"
    depends_on:
      - farc
      - hls_server
    restart: unless-stopped

volumes:
  farc_config:
  farc_data:
  hls_config:
