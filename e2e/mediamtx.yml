# Real RTSP source for the e2e stack (PLAN.md Phase 17 / plan file under
# .claude/plans). mediamtx itself just accepts RTSP publish + serves it back
# out -- the actual "loop the user's mp4 file" job is done by the separate
# ffmpeg-ch1/ffmpeg-ch2 services in docker-compose.e2e.yaml (kept as their
# own containers rather than mediamtx's runOnInit hooks, since the official
# mediamtx image isn't guaranteed to bundle ffmpeg).
rtspAddress: :8554

# Control API (apid's target, .scratch/live-page/spec.md) + WebRTC/WHEP --
# kept in sync with mediamtx.dev.yml's own additions even though no
# Playwright spec drives real WebRTC playback yet (jsdom/Chromium-under-
# Playwright still needs a real ICE path this harness doesn't set up) --
# this keeps e2e's apid service (docker-compose.e2e.yaml) able to
# provision paths against a real mediamtx.
api: yes
apiAddress: :9997

webrtc: yes
webrtcAddress: :8889

authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

paths:
  ch1:
  ch2:
