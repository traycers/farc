site_name: farc docs
site_description: Документация архива farc
site_author: dim shu
site_url: https://github.com/traycers/farc
repo_url: https://github.com/traycers/farc
repo_name: traycers/farc
docs_dir: ./docs/
site_dir: ../build/site/

theme:
  name: material
  language: ru

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - header.autohide
    - search.highlight
    - search.suggest

copyright: "© 2026 farc"

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Как писать архитектуру: guides/writing-architecture-docs.md
  - Архив:
      - Требования: archive/00-requirements.md
      - Архитектура: archive/01-architecture.md
      - Концепция хранилища: archive/02-storage.md
      - Формат фблока: archive/03-storage-format.md
      - Операции хранилища: archive/04-storage-operations.md
      - Формат данных: archive/05-data-format.md
      - Заполнение фконтейнера: archive/09-fcontainer-write-path.md
      - Формат TOC: archive/06-toc-format.md
      - Дерево данных: archive/07-media-tree.md
      - Деревья на базе массивов: archive/08-array-trees.md
      - Политика захвата: archive/10-capture-policy.md
      - Композиция сервиса: archive/11-service-composition.md
      - hls_server (HLS-воспроизведение): archive/12-hls-server.md
  - ADR:
      - header-location: archive/adr/001-header-location.md
      - index-storage: archive/adr/002-index-storage.md
      - data-delivery: archive/adr/003-data-delivery.md
      - read-strategy: archive/adr/004-read-strategy.md
      - write-priority: archive/adr/005-write-priority.md
      - lazy-init: archive/adr/006-lazy-init.md
      - external-catalog: archive/adr/007-external-catalog.md
      - write-sequence: archive/adr/008-write-sequence.md
      - params-json: archive/adr/009-params-json.md
      - direct-io: archive/adr/010-direct-io.md
      - read-bandwidth: archive/adr/011-read-bandwidth.md
      - retention-clock: archive/adr/012-retention-clock.md
      - fcontainer-term: archive/adr/013-fcontainer-term.md
      - channel-registry: archive/adr/014-channel-registry.md
      - toc-push: archive/adr/015-toc-push.md
      - toc-resolve-fallback: archive/adr/016-toc-resolve-fallback.md
      - periodic-fchunk-flush: archive/adr/017-periodic-fchunk-flush.md
      - hls-index-toc-push: archive/adr/018-hls-index-toc-push.md
      - hls-segment-fcontainer-boundary: archive/adr/019-hls-segment-fcontainer-boundary.md
  - Обучение:
      - Merkle-дерево (parent/sibling/value): learning/merkle-tree.md
      - Reed-Solomon (восстановление после потери блоков): learning/reed-solomon.md
      - "Конспект: Hsu, A Data Parallel Compiler Hosted on the GPU":
          - Обзор: hsu-dissertation/index.md
          - 1. APL, Co-dfns и Nanopass: hsu-dissertation/01-apl-and-background.md
          - 2. Архитектура компилятора и AST: hsu-dissertation/02-ast-representation.md
          - 3. Проходы компилятора 3.5-3.13: hsu-dissertation/03-compiler-passes.md
          - 4. Производительность: hsu-dissertation/04-performance.md
          - 5. Идиомы, преимущества, ограничения: hsu-dissertation/05-discussion-idioms.md
          - 6. Future/Related Work, выводы: hsu-dissertation/06-future-related-conclusion.md
